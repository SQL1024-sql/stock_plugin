# ------------------------------------------------------------
#  訊息（MiniMessage 格式）
#  佔位符用 {大括號}，例如 {symbol} {shares} {gold}
# ------------------------------------------------------------
messages:
  prefix: '<gold>[金錠股市] <reset>'
  no-permission: '<red>你沒有權限這麼做。'
  player-only: '<red>這個指令只能由玩家使用。'
  unknown-stock: '<red>找不到代號 <white>{symbol}</white>，用 <yellow>/stock list</yellow> 看清單。'
  invalid-number: '<red><white>{input}</white> 不是有效的數量。'
  shares-too-many: '<red>單筆交易最多 <white>{max}</white> 股。'
  hold-limit: '<red>你最多只能持有 <white>{max}</white> 股 <white>{symbol}</white>（目前 <white>{held}</white> 股）。'
  gold-limit: '<red>單筆交易金額上限為 <white>{max}</white> 金錠（這筆是 <white>{gold}</white>）。'
  not-enough-gold: '<red>金錠不足！需要 <white>{need}</white>，你身上只有 <white>{have}</white>。'
  not-enough-shares: '<red>你只有 <white>{held}</white> 股 <white>{symbol}</white>。'
  buy-success: '<green>買入 <white>{shares}</white> 股 {name} <gray>@</gray> <white>{price}</white>，花費 <gold>{gold}</gold> 金錠<gray>（含手續費 {fee}）</gray>。'
  sell-success: '<green>賣出 <white>{shares}</white> 股 {name} <gray>@</gray> <white>{price}</white>，收入 <gold>{gold}</gold> 金錠<gray>（含手續費 {fee}）</gray>，損益 {pnl}。'
  inventory-full: '<yellow>背包放不下，多餘的金錠已掉在你腳邊。'
  no-holdings: '<yellow>你目前沒有任何持股。'
  reloaded: '<green>設定已重新載入（共 <white>{count}</white> 檔股票）。'
  price-set: '<green>已將 {name} 的股價設為 <white>{price}</white>。'
  ticked: '<green>已手動更新股價。'
  big-move-up: '<green>▲ {name} <white>{symbol}</white> 大漲 <white>{change}%</white>，現價 <gold>{price}</gold> 金錠！'
  big-move-down: '<red>▼ {name} <white>{symbol}</white> 大跌 <white>{change}%</white>，現價 <gold>{price}</gold> 金錠！'
