# ============================================================
#  GoldStock — 金錠股市
#  貨幣：金錠（GOLD_INGOT，玩家背包裡的實體物品）
#  適用：Paper 26.1.2（需要 Java 25）
# ============================================================

market:
  # 每隔幾秒更新一次股價
  update-interval-seconds: 300
  # 單次更新最大漲跌幅（%），防止價格暴衝
  max-tick-change-percent: 18.0
  # 每檔股票保留幾個歷史價格點（用於走勢圖）
  history-points: 120
  # 手續費（%）：買入時加收、賣出時扣除
  fee-percent: 1.0
  # 每次更新後是否全服廣播漲跌摘要
  broadcast-updates: false
  # 單次更新漲跌超過這個 % 時，全服廣播該檔股票（設 0 關閉）
  announce-big-moves-percent: 10.0

limits:
  # 單筆交易最多幾股
  max-shares-per-trade: 5000
  # 每位玩家每檔股票最多持有幾股
  max-shares-per-stock: 20000
  # 單筆交易金額上限（金錠）；賣出時避免一次吐出太多物品
  max-gold-per-transaction: 100000

currency:
  # true = 只接受「乾淨」的金錠（沒有自訂名稱／lore／附魔），
  #        避免吃掉玩家的特殊道具
  strict-items: true

gui:
  title: '<gradient:#f2c14e:#f0e6c8>金錠股市</gradient>'
  # 走勢圖寬度（GUI 與聊天欄共用）
  chart-width: 24

# ------------------------------------------------------------
#  股票清單
#  symbol 就是指令要打的代號（不分大小寫）
#    display-name : 顯示名稱（支援 MiniMessage 標籤）
#    icon         : GUI 圖示的 Material
#    initial-price: 初始股價（金錠 / 股）
#    volatility   : 波動率，每次更新的對數報酬標準差（0.02 = 穩、0.10 = 很刺激）
#    drift        : 長期趨勢，每次更新的平均對數報酬（正 = 緩漲、負 = 緩跌）
#    min-price / max-price : 股價上下限
# ------------------------------------------------------------
