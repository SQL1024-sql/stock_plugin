# ============================================================
#  GoldStock — 玉髓錠股市
#  貨幣：玉髓錠（見下方 currency 區段，可指定任何物品）
#  適用：Paper 26.1.2（需要 Java 25）
#
#  ⚠ 所有股價都是「模擬」出來的，跟真實股市無關，
#    只是借用大家熟悉的公司名稱與代號當作遊戲內容。
# ============================================================

market:
  # 每隔幾秒更新一次股價（一次更新 = 一根 K 棒）
  update-interval-seconds: 300
  # 單次更新最大漲跌幅（%），防止價格暴衝
  max-tick-change-percent: 18.0
  # 每檔股票保留幾個歷史價格點（走勢圖與技術指標用）
  history-points: 120
  # 手續費（%）：買入時加收、賣出時扣除
  fee-percent: 1.0
  # 每次更新後是否全服廣播漲跌摘要
  broadcast-updates: false
  # 單次更新漲跌超過這個 % 時，全服廣播該檔股票（設 0 關閉）
  announce-big-moves-percent: 10.0

# ------------------------------------------------------------
#  財經新聞（唯一「可以稍微預測未來」的來源）
#
#  每次股價更新後，有機率跳出一則新聞，指向某一檔股票的
#  「利多」或「利空」。新聞會在接下來幾次更新裡，給那檔股票
#  一點額外的漲跌傾向 —— 但只是傾向，不是保證：
#    * accuracy-percent 決定新聞說的方向有多少機率是真的
#    * 剩下的機率就是假消息，方向會相反
#    * 而且隨機波動仍然可能蓋過新聞的影響
#  所以看新聞下注長期會贏，但單筆還是會輸，這是刻意的。
# ------------------------------------------------------------
news:
  enabled: true
  # 每次股價更新，有多少 % 機率發生一則新聞
  chance-percent: 25.0
  # 新聞方向的準確率（%）。50 = 純亂猜，100 = 穩賺（不建議）
  accuracy-percent: 70.0
  # 一則新聞影響幾次股價更新
  duration-updates: 3
  # 新聞的力道：實際偏移量 = 這個數字 × 該股波動率 × 隨機 0.6~1.4
  # 0.7 大約等於「一則新聞抵得過大半個標準差」
  impact-multiplier: 0.7
  # 同時最多存在幾則新聞
  max-active: 3
  # 是否全服廣播新聞
  broadcast: true
  # 新聞跑馬燈保留幾則歷史（/stock news 會顯示）
  keep-history: 10
  headlines:
    bullish:
      - '{name} 公布財報優於預期，外資調高目標價'
      - '{name} 拿下大單，法人喊進'
      - '{name} 新產品線傳出提前量產'
      - '{name} 宣布庫藏股買回'
      - '分析師：{name} 進入成長循環，評等調升至買進'
      - '{name} 傳出將納入指數成分股'
      - '{name} 上季出貨量創同期新高'
    bearish:
      - '{name} 財報不如預期，盤後重挫'
      - '{name} 遭大客戶砍單，供應鏈拉警報'
      - '{name} 傳出高層異動，市場觀望'
      - '外資調降 {name} 評等至中立'
      - '{name} 產線傳出良率問題'
      - '{name} 面臨新對手低價競爭'
      - '{name} 大股東申報轉讓持股'

limits:
  # 單筆交易最多幾股
  max-shares-per-trade: 5000
  # 每位玩家每檔股票最多持有幾股
  max-shares-per-stock: 20000
  # 單筆交易金額上限；賣出時避免一次吐出太多物品
  max-gold-per-transaction: 100000

# ------------------------------------------------------------
#  貨幣：玩家背包裡的實體物品
#
#  material   : 基底材質（原版 Material 名稱）
#  display-name: 訊息裡顯示的名稱，支援 MiniMessage
#  match      : 怎麼認出「這顆是錢」
#     vanilla    = 乾淨的原版物品（沒有自訂名稱／lore／附魔／自訂模型）
#     name       = 物品名稱必須等於 match-name（給其他插件做的自訂道具用）
#     item-model = item_model 必須等於 match-item-model
#     any        = 只要材質對就算（連有名字的都會被扣，慎用）
#
#  ⚠「玉髓錠」不是 Minecraft 26.1／26.2 的原版物品。
#    如果它是你伺服器上其他插件做的自訂道具，把 material 改成它的
#    基底材質，match 設成 name（或 item-model）就能正確辨識。
# ------------------------------------------------------------
currency:
  material: GOLD_INGOT
  display-name: '<gradient:#8fd3c7:#d9f2ec>玉髓錠</gradient>'
  match: name
  match-name: '玉髓錠'
  match-item-model: ''

gui:
  title: '<gradient:#8fd3c7:#d9f2ec>玉髓錠股市</gradient>'
  # 走勢圖寬度（GUI 與聊天欄共用）
  chart-width: 24

# ------------------------------------------------------------
#  技術指標（純粹由歷史股價算出來，不含未來資訊）
#    短均線在長均線之上 = 多頭排列，反之空頭排列
# ------------------------------------------------------------
indicators:
  enabled: true
  short-period: 5
  long-period: 20
  # 均線差距超過這個 % 才算多頭／空頭，否則視為盤整
  trend-threshold-percent: 0.5

# ------------------------------------------------------------
#  股票清單
#  symbol 就是指令要打的代號（不分大小寫；台股代號要加引號）
#    display-name : 顯示名稱（支援 MiniMessage 標籤）
#    icon         : GUI 圖示的 Material
#    initial-price: 初始股價（每股要幾顆貨幣）
#    volatility   : 波動率，每次更新的對數報酬標準差（0.02 = 穩、0.08 = 很刺激）
#    drift        : 長期趨勢，每次更新的平均對數報酬（正 = 緩漲、負 = 緩跌）
#    min-price / max-price : 股價上下限
#
#  ⚠ 這些是模擬價格，不是真實報價，也不會連到任何交易所。
#    嫌太貴就把 initial-price 跟 min/max 一起等比例調小。
# ------------------------------------------------------------
